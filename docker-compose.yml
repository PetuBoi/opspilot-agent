services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      OPSPILOT_API_TOKEN: ${OPSPILOT_API_TOKEN:?Set a random OPSPILOT_API_TOKEN}
    volumes:
      - runtime:/app/data/runtime
      - models:/app/artifacts
    command: >-
      sh -c "uv run --no-sync opspilot seed-demo && uv run --no-sync opspilot index &&
      exec uv run --no-sync uvicorn opspilot.api.app:app --host 0.0.0.0 --port 8000"
  dashboard:
    build: .
    ports: ["127.0.0.1:8501:8501"]
    depends_on: [api]
    environment:
      OPSPILOT_API_URL: http://api:8000
      OPSPILOT_API_TOKEN: ${OPSPILOT_API_TOKEN:?Set a random OPSPILOT_API_TOKEN}
    command: uv run --no-sync streamlit run apps/dashboard.py --server.address 0.0.0.0 --server.port 8501
volumes:
  runtime:
  models:
