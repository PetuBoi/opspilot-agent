[project]
name = "opspilot-agent"
version = "0.1.0"
description = "Auditable local IT incident investigations with persistent human approval"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.34", "pydantic-settings>=2.8",
  "langgraph>=1.0", "langgraph-checkpoint-sqlite>=3.0",
  "scikit-learn>=1.6", "pandas>=2.2", "numpy>=2.2",
  "matplotlib>=3.10", "httpx>=0.28", "huggingface-hub>=0.30",
  "pyarrow>=19", "streamlit>=1.45", "typer>=0.15", "joblib>=1.4", "filelock>=3.18",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.11"]

[project.scripts]
opspilot = "opspilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=opspilot --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
omit = ["*/cli.py"]
